services:
  - type: web
    name: smart-cloud-shield
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt gunicorn && python seed.py"
    startCommand: "gunicorn -w 2 -b 0.0.0.0:$PORT app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SHOW_OTP
        value: "1"
      - key: DEMO_MODE
        value: "0"
      - key: ADMIN_ALERT_EMAIL
        value: "uiuxlab123456@gmail.com"
      - key: MAIL_FROM
        value: "Smart Cloud Shield <banagarsankeerth@gmail.com>"
